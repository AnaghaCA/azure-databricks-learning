# This is a Declarative Automation Bundle definition for azure-databricks-learning.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: azure-databricks-learning

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-84c4ef57-d8c7.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-84c4ef57-d8c7.cloud.databricks.com
resources:
  jobs:
    revenue_pipeline:
      name: "[dev] Revenue Pipeline"
      tasks:
        - task_key: run_revenue_pipeline
          spark_python_task:
            python_file: ./src/first_databricks_pipeline.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
